name: GoreeCloud Since Android CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: since-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  since:
    name: Since build, unit tests, lint, schema, and manifest guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Verify local-only manifest boundary
        run: python3 scripts/check_since_manifest.py

      - name: Assign independent Development version code
        run: echo "GOREECLOUD_DEV_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test, lint, and assemble Since
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify committed Room schema is current
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git status --porcelain --untracked-files=all -- app/schemas)"

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: since-room-schema
          path: app/schemas
          if-no-files-found: error

      - name: Upload Since runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: since-runtime-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  since-runtime:
    name: Since Android 16 runtime instrumentation
    needs: since
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Download validated Since APKs
        uses: actions/download-artifact@v4
        with:
          name: since-runtime-apks
          path: ci-apks

      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
            echo "KVM acceleration is available."
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Android 16 instrumentation will use software acceleration."
          fi

      - name: Run Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: bash scripts/run_since_android_tests.sh

      - name: Upload Since rendered visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: since-rendered-ui
          path: ci-screenshots/*.png
          if-no-files-found: error

  required-gate:
    name: Since Development required gate
    if: always()
    needs:
      - since
      - since-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require exact-head Android validation
        shell: bash
        env:
          SINCE_RESULT: ${{ needs.since.result }}
          SINCE_RUNTIME_RESULT: ${{ needs.since-runtime.result }}
        run: |
          set -euo pipefail

          if [ "$SINCE_RESULT" != "success" ]; then
            echo "::error::Since validation result is $SINCE_RESULT"
            exit 1
          fi

          if [ "$SINCE_RUNTIME_RESULT" != "success" ]; then
            echo "::error::Since Android 16 runtime result is $SINCE_RUNTIME_RESULT"
            exit 1
          fi
